name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run compile

      # Self-contained checks only. The real-data checks (check, check:phone,
      # check:paths) depend on ~/.claude and are intentionally excluded.
      - run: npm run check:ci
